name: Codex autonomous research preflight

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/codex-autonomous-research.yml'
      - 'scripts/research/**'
      - 'scripts/build-pages.mjs'
      - '.agents/skills/0x00c0de-release/**'
      - 'tests/research-*.test.mjs'
  pull_request:
    paths:
      - '.github/workflows/codex-autonomous-research.yml'
      - 'scripts/research/**'
      - 'scripts/build-pages.mjs'
      - '.agents/skills/0x00c0de-release/**'
      - 'tests/research-*.test.mjs'

permissions:
  contents: read

concurrency:
  group: codex-research-${{ github.event_name == 'pull_request' && github.ref || 'default' }}
  cancel-in-progress: false

jobs:
  preflight:
    outputs:
      codex_eligible: ${{ steps.codex_lead.outputs.eligible }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - run: node --test tests/research-preflight.test.mjs tests/research-releases.test.mjs tests/research-features.test.mjs tests/research-implementation.test.mjs tests/research-trending.test.mjs tests/research-codex-proposal.test.mjs
      - name: Restore deduplication history
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: tmp/codex-research/history.json
          key: codex-release-history-v1-${{ github.run_id }}
          restore-keys: codex-release-history-v1-
      - name: Collect release metadata and identify site features
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        run: node scripts/research/report.mjs
      - name: Select a Codex research lead
        id: codex_lead
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: node scripts/research/codex-proposal.mjs tmp/codex-research/report.json
      - name: Retain research report
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: codex-research-${{ github.run_id }}-${{ github.run_attempt }}
          path: tmp/codex-research/report.json
          retention-days: 30
          if-no-files-found: error
      - name: Save deduplication history
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: tmp/codex-research/history.json
          key: codex-release-history-v1-${{ github.run_id }}

  implement:
    if: >-
      github.repository == '0x00C0DE/0x00C0DE.github.io' &&
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request'
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Download this run's research handoff
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --name "codex-research-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --dir tmp/handoff
      - name: Implement and verify an eligible feature
        id: implementation
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          if [[ "$(git rev-parse FETCH_HEAD)" != "$GITHUB_SHA" ]]; then
            echo 'Main changed after research. The next cycle will reassess the candidate.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          refs=$(git ls-remote --heads origin 'refs/heads/US-*')
          max=$(printf '%s\n' "$refs" | sed -nE 's@.*refs/heads/US-([0-9]+)-.*@\1@p' | sort -n | tail -1)
          branch="US-$((10#${max:-0} + 1))-research-feature-v1"
          git switch -c "$branch"
          feature=$(node scripts/research/implement.mjs tmp/handoff/report.json)
          case "$feature" in
            blog-feed)
              changed=index.html
              path=content/feed.xml
              ;;
            sitemap)
              changed=robots.txt
              path=sitemap.xml
              ;;
            '')
              echo 'No reviewed implementation matched the current handoff.' >> "$GITHUB_STEP_SUMMARY"
              exit 0
              ;;
            *) exit 1 ;;
          esac
          node scripts/research/document-feature.mjs "$feature"
          git add -- "$changed" README.md
          git diff --cached --quiet -- "$changed" && exit 1
          while IFS= read -r status; do
            case "$status" in
              "M  README.md"|"M  $changed"|"A  $changed") ;;
              *) exit 1 ;;
            esac
          done < <(git status --porcelain --untracked-files=all)
          git diff --cached --check
          node --test tests/research-implementation.test.mjs
          GITHUB_OUTPUT="$RUNNER_TEMP/pages-build-output" node scripts/build-pages.mjs
          artifact=$(sed -n 's/^path=//p' "$RUNNER_TEMP/pages-build-output")
          python scripts/research/verify-public-feature.py "$feature" "$artifact/$path"
          echo "feature=$feature" >> "$GITHUB_OUTPUT"
          echo "path=$path" >> "$GITHUB_OUTPUT"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Publish research feature: $feature"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
      - name: Publish the feature branch and integrate
        if: steps.implementation.outputs.branch != ''
        env:
          RELEASE_BRANCH: ${{ steps.implementation.outputs.branch }}
        run: |
          git push --atomic origin "HEAD:refs/heads/$RELEASE_BRANCH" HEAD:refs/heads/main
          echo "Integrated $RELEASE_BRANCH at $(git rev-parse HEAD)." >> "$GITHUB_STEP_SUMMARY"
      - name: Dispatch Pages and verify the live feature
        if: steps.implementation.outputs.branch != ''
        env:
          FEATURE: ${{ steps.implementation.outputs.feature }}
          PUBLIC_PATH: ${{ steps.implementation.outputs.path }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          revision=$(git rev-parse HEAD)
          gh workflow run pages.yml --ref main
          for attempt in {1..48}; do
            run=$(gh run list --workflow pages.yml --branch main --event workflow_dispatch --commit "$revision" --limit 1 --json databaseId --jq '.[0].databaseId // empty')
            if [[ -n "$run" ]]; then
              gh run watch "$run" --exit-status --interval 5
              break
            fi
            sleep 5
          done
          test -n "$run"
          for attempt in {1..12}; do
            if curl --fail --silent --max-time 10 "https://0x00c0de.github.io/$PUBLIC_PATH?revision=$revision" --output "$RUNNER_TEMP/live-feature.xml" &&
               python scripts/research/verify-public-feature.py "$FEATURE" "$RUNNER_TEMP/live-feature.xml"; then
              echo "Verified https://0x00c0de.github.io/$PUBLIC_PATH." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          exit 1

  codex_propose:
    needs: [preflight, implement]
    if: >-
      github.repository == '0x00C0DE/0x00C0DE.github.io' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      vars.CODEX_RESEARCH_ENABLED == 'true' &&
      needs.preflight.outputs.codex_eligible == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    outputs:
      patch: ${{ steps.patch.outputs.created }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check for outstanding proposals and current main
        id: ready
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          main=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          prs=$(gh pr list --state open --base main --limit 100 --json headRefName --jq '[.[] | select(.headRefName | endswith("-codex-feature-v1"))] | length')
          if [[ "$main" == "$GITHUB_SHA" && "$prs" == 0 ]]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Download research handoff
        if: steps.ready.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --name "codex-research-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --dir tmp/codex-research
      - name: Generate a feature proposal
        id: codex
        if: steps.ready.outputs.run == 'true'
        uses: openai/codex-action@bdf19a4a223ec2549a3e2274a0cf61556bc07675
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: scripts/research/codex-proposal-prompt.md
          permission-profile: ':workspace'
          safety-strategy: drop-sudo
          effort: low
          codex-args: '["--ephemeral"]'
      - name: Capture the proposal patch
        id: patch
        if: steps.codex.outcome == 'success'
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git diff --cached --binary --no-ext-diff > "$RUNNER_TEMP/codex-feature.patch"
          test "$(wc -c < "$RUNNER_TEMP/codex-feature.patch")" -le 131072
          echo 'created=true' >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: steps.patch.outputs.created == 'true'
        with:
          name: codex-feature-${{ github.run_attempt }}
          path: ${{ runner.temp }}/codex-feature.patch
          retention-days: 3

  codex_verify:
    needs: codex_propose
    if: needs.codex_propose.outputs.patch == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Fetch and validate candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" --name "codex-feature-$GITHUB_RUN_ATTEMPT" --dir "$RUNNER_TEMP/codex-feature"
          git apply --index "$RUNNER_TEMP/codex-feature/codex-feature.patch"
          node scripts/research/codex-proposal.mjs verify
      - name: Test and build the candidate
        run: |
          node --test tests/codex-feature-*.test.mjs tests/research-*.test.mjs
          node scripts/build-pages.mjs

  codex_publish:
    needs: codex_verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Publish verified patch on a new branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          gh run download "$GITHUB_RUN_ID" --name "codex-feature-$GITHUB_RUN_ATTEMPT" --dir "$RUNNER_TEMP/codex-feature"
          patch="$RUNNER_TEMP/codex-feature/codex-feature.patch"
          test "$(wc -c < "$patch")" -le 131072
          git apply --index "$patch"
          node scripts/research/codex-proposal.mjs verify
          refs=$(git ls-remote --heads origin 'refs/heads/US-*')
          max=$(printf '%s\n' "$refs" | sed -nE 's@.*refs/heads/US-([0-9]+)-.*@\1@p' | sort -n | tail -1)
          branch="US-$((10#${max:-0} + 1))-codex-feature-v1"
          git switch -c "$branch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -c core.hooksPath=/dev/null commit -m 'Propose a site feature from Trending research'
          git push origin "HEAD:refs/heads/$branch"
          gh pr create --base main --head "$branch" --title 'Site feature from Trending research' --body "Generated from the scheduled research handoff. Feature tests and the Pages build passed in [this run](https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID). Review the change and run applicable site checks before merging."
