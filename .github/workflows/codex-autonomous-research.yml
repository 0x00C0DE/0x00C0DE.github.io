name: Codex autonomous research preflight

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/codex-autonomous-research.yml'
      - 'scripts/research/**'
      - 'scripts/build-pages.mjs'
      - '.agents/skills/0x00c0de-release/**'
      - 'tests/research-*.test.mjs'
  pull_request:
    paths:
      - '.github/workflows/codex-autonomous-research.yml'
      - 'scripts/research/**'
      - 'scripts/build-pages.mjs'
      - '.agents/skills/0x00c0de-release/**'
      - 'tests/research-*.test.mjs'

permissions:
  contents: read

concurrency:
  group: codex-research-${{ github.event_name == 'pull_request' && github.ref || 'default' }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - run: node --test tests/research-preflight.test.mjs tests/research-releases.test.mjs tests/research-features.test.mjs tests/research-implementation.test.mjs tests/research-trending.test.mjs
      - name: Restore deduplication history
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: tmp/codex-research/history.json
          key: codex-release-history-v1-${{ github.run_id }}
          restore-keys: codex-release-history-v1-
      - name: Collect release metadata and identify site features
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        run: node scripts/research/report.mjs
      - name: Retain research report
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: codex-research-${{ github.run_id }}-${{ github.run_attempt }}
          path: tmp/codex-research/report.json
          retention-days: 30
          if-no-files-found: error
      - name: Save deduplication history
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: tmp/codex-research/history.json
          key: codex-release-history-v1-${{ github.run_id }}

  implement:
    if: >-
      github.repository == '0x00C0DE/0x00C0DE.github.io' &&
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request'
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Download this run's research handoff
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --name "codex-research-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --dir tmp/handoff
      - name: Implement and verify an eligible feature
        id: implementation
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          if [[ "$(git rev-parse FETCH_HEAD)" != "$GITHUB_SHA" ]]; then
            echo 'Main changed after research. The next cycle will reassess the candidate.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          refs=$(git ls-remote --heads origin 'refs/heads/US-*')
          max=$(printf '%s\n' "$refs" | sed -nE 's@.*refs/heads/US-([0-9]+)-.*@\1@p' | sort -n | tail -1)
          branch="US-$((10#${max:-0} + 1))-research-feature-v1"
          git switch -c "$branch"
          feature=$(node scripts/research/implement.mjs tmp/handoff/report.json)
          case "$feature" in
            blog-feed)
              changed=index.html
              path=content/feed.xml
              ;;
            sitemap)
              changed=robots.txt
              path=sitemap.xml
              ;;
            '')
              echo 'No reviewed implementation matched the current handoff.' >> "$GITHUB_STEP_SUMMARY"
              exit 0
              ;;
            *) exit 1 ;;
          esac
          node scripts/research/document-feature.mjs "$feature"
          git add -- "$changed" README.md
          git diff --cached --quiet -- "$changed" && exit 1
          while IFS= read -r status; do
            case "$status" in
              "M  README.md"|"M  $changed"|"A  $changed") ;;
              *) exit 1 ;;
            esac
          done < <(git status --porcelain --untracked-files=all)
          git diff --cached --check
          node --test tests/research-implementation.test.mjs
          GITHUB_OUTPUT="$RUNNER_TEMP/pages-build-output" node scripts/build-pages.mjs
          artifact=$(sed -n 's/^path=//p' "$RUNNER_TEMP/pages-build-output")
          python scripts/research/verify-public-feature.py "$feature" "$artifact/$path"
          echo "feature=$feature" >> "$GITHUB_OUTPUT"
          echo "path=$path" >> "$GITHUB_OUTPUT"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Publish research feature: $feature"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
      - name: Publish the feature branch and integrate
        if: steps.implementation.outputs.branch != ''
        env:
          RELEASE_BRANCH: ${{ steps.implementation.outputs.branch }}
        run: |
          git push --atomic origin "HEAD:refs/heads/$RELEASE_BRANCH" HEAD:refs/heads/main
          echo "Integrated $RELEASE_BRANCH at $(git rev-parse HEAD)." >> "$GITHUB_STEP_SUMMARY"
      - name: Dispatch Pages and verify the live feature
        if: steps.implementation.outputs.branch != ''
        env:
          FEATURE: ${{ steps.implementation.outputs.feature }}
          PUBLIC_PATH: ${{ steps.implementation.outputs.path }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          revision=$(git rev-parse HEAD)
          gh workflow run pages.yml --ref main
          for attempt in {1..48}; do
            run=$(gh run list --workflow pages.yml --branch main --event workflow_dispatch --commit "$revision" --limit 1 --json databaseId --jq '.[0].databaseId // empty')
            if [[ -n "$run" ]]; then
              gh run watch "$run" --exit-status --interval 5
              break
            fi
            sleep 5
          done
          test -n "$run"
          for attempt in {1..12}; do
            if curl --fail --silent --max-time 10 "https://0x00c0de.github.io/$PUBLIC_PATH?revision=$revision" --output "$RUNNER_TEMP/live-feature.xml" &&
               python scripts/research/verify-public-feature.py "$FEATURE" "$RUNNER_TEMP/live-feature.xml"; then
              echo "Verified https://0x00c0de.github.io/$PUBLIC_PATH." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          exit 1
