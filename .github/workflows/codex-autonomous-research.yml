name: Codex autonomous research preflight

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/codex-autonomous-research.yml'
      - 'scripts/research/**'
      - 'tests/research-*.test.mjs'
  pull_request:
    paths:
      - '.github/workflows/codex-autonomous-research.yml'
      - 'scripts/research/**'
      - 'tests/research-*.test.mjs'

permissions:
  contents: read

concurrency:
  group: codex-research-${{ github.event_name == 'pull_request' && github.ref || 'default' }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - run: node --test tests/research-preflight.test.mjs tests/research-releases.test.mjs
      - name: Restore deduplication history
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: tmp/codex-research/history.json
          key: codex-release-history-v1-${{ github.run_id }}
          restore-keys: codex-release-history-v1-
      - name: Collect official release metadata
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        run: node scripts/research/report.mjs
      - name: Retain research report
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: codex-research-${{ github.run_id }}-${{ github.run_attempt }}
          path: tmp/codex-research/report.json
          retention-days: 30
          if-no-files-found: error
      - name: Save deduplication history
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: tmp/codex-research/history.json
          key: codex-release-history-v1-${{ github.run_id }}
