<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f6f3ef">
    <title>Résumé</title>
    <link rel="stylesheet" href="resume-intro.css?v=full-bleed">
</head>
<body>
    <div id="intro" hidden>
        <video id="cinematic" playsinline preload="none" aria-hidden="true"
               data-src="/assets/resume-crystal-whiteout-4k.mp4"
               data-compact-src="/assets/resume-crystal-whiteout-1080p.mp4"></video>
        <div class="cinematic-actions">
            <button type="button" id="cinematic-sound" aria-pressed="true" hidden>Sound</button>
            <a id="resume-skip" href="#resume">Skip to resume <span aria-hidden="true">↗</span></a>
        </div>
    </div>
    <main id="resume" tabindex="-1" aria-label="Résumé">
        <article class="resume-page" aria-label="Professional résumé">
            <h1>Résumé</h1>
            <p id="resume-status" role="status">Loading résumé…</p>
            <noscript><p>Enable JavaScript to display the HTML résumé.</p></noscript>
        </article>
    </main>
    <script type="module">
        const intro = document.querySelector('#intro');
        const video = document.querySelector('#cinematic');
        const resume = document.querySelector('#resume');
        const sound = document.querySelector('#cinematic-sound');
        const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
        let deadline;

        import('./resume-content.mjs?v=pdf-layout')
            .then(({ populateResume }) => populateResume(document.querySelector('.resume-page'), '/assets/resume.pdf?v=20260810a'))
            .catch(error => {
                console.warn('HTML résumé could not load', error.name);
                document.querySelector('#resume-status').textContent = 'The résumé could not load. Refresh this page to try again.';
            });

        const revealResume = (animate = false) => {
            if (intro.hidden) return;
            clearTimeout(deadline);
            intro.hidden = true;
            video.pause();
            resume.inert = false;
            document.body.classList.remove('cinematic-active');
            if (animate && !reducedMotion.matches) resume.classList.add('resume-handoff');
            resume.focus({ preventScroll: true });
        };

        const allowPlaybackTime = () => {
            if (intro.hidden) return;
            clearTimeout(deadline);
            deadline = setTimeout(revealResume, 5000);
        };

        if (!reducedMotion.matches && location.hash !== '#resume') {
            intro.hidden = false;
            resume.inert = true;
            document.body.classList.add('cinematic-active');
            video.addEventListener('ended', () => revealResume(true), { once: true });
            video.addEventListener('error', () => revealResume(), { once: true });
            video.addEventListener('waiting', allowPlaybackTime);
            video.addEventListener('playing', () => {
                clearTimeout(deadline);
                sound.hidden = false;
            });
            video.addEventListener('volumechange', () => {
                sound.setAttribute('aria-pressed', String(!video.muted));
                sound.title = video.muted ? 'Tap to enable sound' : 'Mute sound';
            });
            const enableSound = () => {
                video.muted = false;
                video.play().catch(error => {
                    video.muted = true;
                    console.warn('Cinematic sound could not start', error.name);
                });
            };
            sound.addEventListener('click', () => {
                if (video.muted) enableSound();
                else video.muted = true;
            });
            reducedMotion.addEventListener('change', event => {
                if (event.matches) revealResume();
            });
            document.addEventListener('keydown', event => {
                if (event.key === 'Escape' && !event.defaultPrevented) revealResume();
            });
            document.querySelector('#resume-skip').addEventListener('click', event => {
                if (event.button === 0 && !event.ctrlKey && !event.metaKey &&
                    !event.shiftKey && !event.altKey) {
                    event.preventDefault();
                    revealResume();
                }
            });
            allowPlaybackTime();
            const compactViewport = matchMedia('(max-width: 900px), (max-height: 600px)').matches;
            video.src = compactViewport ? video.dataset.compactSrc : video.dataset.src;
            video.muted = false;
            video.play().catch(error => {
                if (error.name !== 'NotAllowedError' || intro.hidden) {
                    revealResume();
                    return;
                }
                video.muted = true;
                document.addEventListener('click', event => {
                    if (!intro.hidden && video.muted && !event.target.closest('.cinematic-actions')) {
                        enableSound();
                    }
                }, { once: true });
                video.play().catch(() => revealResume());
            });
        }
    </script>
</body>
</html>
